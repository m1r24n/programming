syntax = "proto3";

service Greeter {
   rpc greet (ClientInput) returns (ServerOutput) {}
}
message ClientInput {
   string greeting = 1;
   string name = 2;
}
message ServerOutput {
   string message = 1;
}

python -m grpc_tools.protoc -I ../common_proto_files/ -- python_out=../python --grpc_python_out=. greeting.proto